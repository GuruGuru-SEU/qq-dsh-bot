name: qq-dsh-bot
services:
  bot:
    build: .
    image: qq-dsh-bot:local
    container_name: qq-dsh-bot
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Missing DeepSeek key}
      ONEBOT_TOKEN: ${ONEBOT_TOKEN:?Missing OneBot token}
      HOME: /home/node
      DSH_PERMISSION_MODE: workspace-write
      DSH_TELEMETRY_MODE: DISABLED
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
    volumes:
      - ./state:/state:Z
      - ./config:/etc/bot:ro,Z
      - ./dsh-config:/etc/dsh:ro,Z
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    networks:
      napcat:
        aliases: [qq-dsh-bot]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
networks:
  napcat:
    external: true
    name: ${ONEBOT_NETWORK:-${NAPCAT_NETWORK:-napcat_default}}
